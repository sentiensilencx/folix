<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>folix</title>
<link href="https://fonts.googleapis.com/css2?family=Della+Respira&display=swap" rel="stylesheet"/>
<link rel="icon" href="folix.ico">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #0d0c0b; height: 100vh; overflow: hidden; font-family: 'JetBrains Mono','Fira Code','Cascadia Code','Courier New',monospace; color: #c8c2b6; font-size: 12px; }
#app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; min-height: 0; }
.dr { font-family: 'Della Respira', Georgia, serif; }

/* ── topbar ── */
.topbar {
  display: flex; align-items: center; gap: 0;
  border-bottom: 0.5px solid #272420;
  padding: 0 24px; background: #0f0e0c;
  height: 40px; flex-wrap: nowrap; overflow: hidden;
}
.dots { display: flex; gap: 5px; flex-shrink: 0; margin-right: 14px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #383430; }
.cmd { color: #555048; font-size: 11px; flex-shrink: 0; margin-right: 20px; }
.cmd .hi { color: #847870; }

.queue-tabs { display: flex; align-items: center; gap: 0; flex: 1; }
.qtab {
  display: flex; align-items: center; gap: 6px;
  padding: 0 14px; height: 40px;
  border-left: 0.5px solid #222018;
  color: #504840; cursor: pointer;
  transition: color 0.15s, background 0.15s;
  font-size: 11px; white-space: nowrap;
}
.qtab:hover { color: #9a9080; background: #131210; }
.qtab.active { color: #c0b8a8; border-bottom: 1px solid #847870; }
.qtab .qname { outline: none; background: none; border: none; font-family: inherit; font-size: 11px; color: inherit; cursor: pointer; min-width: 20px; max-width: 120px; }
.qtab.active .qname { cursor: text; }
.qtab .qname:focus { color: #d4cfc5; outline: none; }
.qtab .qdel { opacity: 0; font-size: 10px; color: #6a6258; transition: opacity 0.15s; cursor: pointer; margin-left: 2px; }
.qtab:hover .qdel { opacity: 1; }
.qtab .qdel:hover { color: #c0b8a8; }
.qadd {
  padding: 0 12px; height: 40px;
  border-left: 0.5px solid #222018;
  color: #444038; cursor: pointer;
  transition: color 0.15s; font-size: 11px;
  display: flex; align-items: center;
}
.qadd:hover { color: #847870; }
.qadd.hidden { display: none; }

/* ── confirm dialog ── */
.confirm-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.6); z-index: 100;
  align-items: center; justify-content: center;
}
.confirm-overlay.show { display: flex; }
.confirm-box {
  background: #161412; border: 0.5px solid #2e2b27;
  border-radius: 6px; padding: 24px 28px;
  display: flex; flex-direction: column; gap: 16px;
  max-width: 320px; width: 90%;
}
.confirm-msg { color: #c0b8a8; font-size: 12px; line-height: 1.6; }
.confirm-msg .warn { color: #d4cfc5; }
.confirm-btns { display: flex; gap: 8px; justify-content: flex-end; }
.confirm-btns button {
  font-family: inherit; font-size: 11px; cursor: pointer;
  padding: 5px 14px; border-radius: 3px; border: 0.5px solid #2e2b27;
  background: none; color: #8a8278; transition: color 0.15s, border-color 0.15s;
}
.confirm-btns button:hover { color: #c0b8a8; border-color: #5a5550; }
.confirm-btns .btn-confirm { color: #c0b8a8; border-color: #5a5550; }
.confirm-btns .btn-confirm:hover { color: #e05a5a; border-color: #e05a5a; }

/* ── body grid ── */
.body-grid { display: grid; grid-template-columns: 300px 1fr; min-height: 0; }

/* ── left panel ── */
.left-panel {
  border-right: 0.5px solid #222018;
  padding: 28px 24px;
  display: flex; flex-direction: column; gap: 24px;
  background: #111009; overflow-y: auto;
}
#albumArt { width: 100%; aspect-ratio: 1; border-radius: 3px; object-fit: cover; display: none; border: 0.5px solid #2e2b27; }
.art-ph {
  width: 100%; aspect-ratio: 1; border-radius: 3px;
  background: #1a1815; border: 0.5px dashed #2e2b27;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; color: #444038; gap: 8px; transition: border-color 0.2s, color 0.2s;
}
.art-ph:hover { border-color: #5a5550; color: #7a7268; }
.art-ph.has-track { cursor: default; }
.art-ph.has-track:hover { border-color: #2e2b27; color: #444038; }
.art-ph .glyph { font-size: 40px; opacity: 0.25; font-family: 'Della Respira', Georgia, serif; }
.art-ph span { font-size: 10px; }
.art-ph.has-track .ph-hint { display: none; }
.track-title { font-size: 24px; color: #e0dbd0; line-height: 1.1; }
.track-sub { font-size: 11px; color: #706860; font-style: italic; line-height: 1.6; }
.prog-track { height: 1px; background: #2e2b27; cursor: pointer; transition: height 0.15s; }
.prog-track:hover { height: 2px; }
.prog-fill { height: 100%; background: #847870; width: 0%; transition: width 0.1s linear; }
.time-row { display: flex; justify-content: space-between; font-size: 10px; color: #5a5550; margin-top: 4px; }
.ctrl-unified { display: flex; border: 0.5px solid #2e2b27; border-radius: 3px; overflow: hidden; }
.ctrl-unified button {
  font-family: inherit; background: none; border: none; cursor: pointer;
  font-size: 11px; color: #7a7268; padding: 7px 0;
  transition: background 0.15s, color 0.15s;
  border-right: 0.5px solid #2e2b27; flex: 1; text-align: center;
}
.ctrl-unified button:last-child { border-right: none; }
.ctrl-unified button:hover { background: #1a1815; color: #c0b8a8; }
#playBtn { color: #c0b8a8; }
.vol-row { display: flex; align-items: center; gap: 8px; }
.vol-lbl { font-size: 10px; color: #5a5550; }
input[type=range].vol { -webkit-appearance: none; height: 1px; background: #2e2b27; outline: none; flex: 1; cursor: pointer; }
input[type=range].vol::-webkit-slider-thumb { -webkit-appearance: none; width: 7px; height: 7px; border-radius: 50%; background: #847870; cursor: pointer; }
.folder-status { font-size: 10px; color: #5a5550; font-style: italic; margin-top: 6px; }

/* ── right panel ── */
.right-panel { display: flex; flex-direction: column; padding: 28px 28px 0; gap: 0; overflow: hidden; }
.section-label { font-size: 10px; color: #4a4742; letter-spacing: 0.08em; margin-bottom: 8px; }
#visCanvas { width: 100%; height: 140px; display: block; border-radius: 2px; margin-bottom: 28px; }
.queue-section { display: flex; flex-direction: column; gap: 0; flex: 1; overflow: hidden; }
#trackList { list-style: none; display: flex; flex-direction: column; overflow-y: auto; flex: 1; padding-right: 10px; }
#trackList::-webkit-scrollbar { width: 2px; }
#trackList::-webkit-scrollbar-thumb { background: #2e2b27; }
#trackList li { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-bottom: 0.5px solid #1e1c19; cursor: pointer; transition: color 0.15s; }
#trackList li:last-child { border-bottom: none; }
#trackList li .idx { color: #484440; font-size: 10px; min-width: 20px; }
#trackList li .tname { font-family: 'Della Respira', Georgia, serif; font-size: 14px; color: #706860; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#trackList li .tart { font-size: 10px; color: #5a5550; white-space: nowrap; }
#trackList li:hover .tname { color: #b0a898; }
#trackList li:hover .idx { color: #706860; }
#trackList li.now .tname { color: #d4cfc5; }
#trackList li.now .idx { color: #847870; }
#trackList li.queued .tname { color: #a89a78; }
.qbadge { font-size: 8px; letter-spacing: 0.04em; color: #847870; border: 0.5px solid #3a3732; border-radius: 2px; padding: 1px 5px; text-transform: uppercase; flex-shrink: 0; }
.ctx-menu {
  display: none; position: fixed; z-index: 200;
  background: #161412; border: 0.5px solid #2e2b27; border-radius: 4px;
  min-width: 150px; padding: 4px 0;
  box-shadow: 0 6px 20px rgba(0,0,0,0.45);
}
.ctx-menu.show { display: block; }
.ctx-item { padding: 7px 14px; font-size: 11px; color: #9a9080; cursor: pointer; white-space: nowrap; transition: background 0.1s, color 0.1s; }
.ctx-item:hover { background: #1a1815; color: #e0dbd0; }
#trackList li.empty { cursor: pointer; }
#trackList li.empty .tname { font-family: monospace; font-size: 11px; color: #484440; font-style: italic; }
#trackList li.empty:hover .tname { color: #847870; }

/* ── command panel (ctrl+y) ── */
.cmdp-overlay {
  display: flex; position: fixed; inset: 0;
  background: rgba(0,0,0,0.6); z-index: 150;
  align-items: flex-start; justify-content: center;
  padding-top: 12vh;
  opacity: 0; pointer-events: none;
  transition: opacity 0.15s ease;
}
.cmdp-overlay.show { opacity: 1; pointer-events: auto; }
.cmdp-box {
  background: #161412; border: 0.5px solid #2e2b27; border-radius: 6px;
  width: 520px; max-width: 90%; max-height: 60vh;
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  transform: translateY(-8px) scale(0.97);
  transition: transform 0.18s cubic-bezier(0.16,1,0.3,1);
}
.cmdp-overlay.show .cmdp-box { transform: translateY(0) scale(1); }
.cmdp-inputrow {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 18px; border-bottom: 0.5px solid #222018; flex-shrink: 0;
}
.cmdp-prompt { font-size: 11px; color: #555048; white-space: nowrap; }
.cmdp-prompt .hi { color: #847870; }
.cmdp-input {
  flex: 1; background: none; border: none; outline: none;
  font-family: inherit; font-size: 12px; color: #c8c2b6;
}
.cmdp-input::placeholder { color: #444038; }
.cmdp-label { padding: 12px 18px 6px; margin-bottom: 0; flex-shrink: 0; }
.cmdp-results { list-style: none; overflow-y: auto; padding: 0 8px 8px; }
.cmdp-results::-webkit-scrollbar { width: 2px; }
.cmdp-results::-webkit-scrollbar-thumb { background: #2e2b27; }
.cmdp-item {
  display: flex; align-items: baseline; gap: 10px;
  padding: 8px 10px; border-radius: 3px; cursor: pointer;
  transition: background 0.1s, color 0.1s;
}
.cmdp-item .tname { font-family: 'Della Respira', Georgia, serif; font-size: 14px; color: #706860; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmdp-item .tart { font-size: 10px; color: #5a5550; white-space: nowrap; }
.cmdp-item .qbadge { font-size: 8px; letter-spacing: 0.04em; color: #847870; border: 0.5px solid #3a3732; border-radius: 2px; padding: 1px 5px; text-transform: uppercase; flex-shrink: 0; }
.cmdp-item:hover, .cmdp-item.sel { background: #1a1815; }
.cmdp-item:hover .tname, .cmdp-item.sel .tname { color: #d4cfc5; }
.cmdp-item.sel .idx, .cmdp-item.sel .tart { color: #847870; }
.cmdp-empty { padding: 16px 10px; font-size: 11px; color: #484440; font-style: italic; text-align: center; }
.cmdp-hint { padding: 8px 18px; border-top: 0.5px solid #222018; font-size: 10px; color: #484440; text-align: center; flex-shrink: 0; }

/* ── bottombar ── */
.bottombar { border-top: 0.5px solid #222018; padding: 9px 24px; display: flex; justify-content: space-between; align-items: center; background: #0f0e0c; font-size: 10px; color: #484440; }
#nextUp { font-style: italic; font-family: 'Della Respira', Georgia, serif; color: #6a6258; }
#fileInput { display: none; }
.right-hints { display: flex; align-items: center; gap: 10px; }
.drop-hint { color: #3a3732; transition: color 0.15s; }
.loop-ind { display: none; color: #847870; }
.loop-ind.show { display: inline; }
#app.drag-active .drop-hint { color: #c0b8a8; }
#app.drag-active { outline: 1px dashed #5a5550; outline-offset: -1px; }
#app.drag-active .art-ph { border-color: #847870; color: #b0a898; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <span class="cmd">hazel<span class="hi">@foli</span>:~$ <span class="hi">play</span> --visualize</span>
    <div class="queue-tabs" id="queueTabs"></div>
    <div class="qadd" id="qaddBtn" onclick="addQueue()" title="new playlist">[ + playlist ]</div>
  </div>

  <div class="body-grid">
    <div class="left-panel">
      <div>
        <img id="albumArt" alt=""/>
        <div class="art-ph" id="artPh" onclick="artPhClick()">
          <span class="glyph">♪</span>
          <span class="ph-hint">click or drop tracks / folders</span>
        </div>
      </div>
      <div>
        <div class="track-title dr" id="trackTitle">—</div>
        <div class="track-sub" id="trackSub">open a folder to begin</div>
      </div>
      <div>
        <div class="prog-track" id="progTrack"><div class="prog-fill" id="progFill"></div></div>
        <div class="time-row"><span id="timeEl">0:00</span><span id="durEl">0:00</span></div>
      </div>
      <div class="ctrl-unified">
        <button onclick="seek(-10)">[ -10 ]</button>
        <button id="playBtn" onclick="togglePlay()">[ play ]</button>
        <button onclick="seek(10)">[ +10 ]</button>
      </div>
      <div class="vol-row">
        <span class="vol-lbl">vol</span>
        <input type="range" class="vol" min="0" max="1" step="0.01" value="0.8" oninput="setVol(this.value)"/>
      </div>
      <div>
        <div class="folder-status" id="folderStatus"></div>
      </div>
    </div>

    <div class="right-panel">
      <div class="section-label">// frequency analysis</div>
      <canvas id="visCanvas"></canvas>
      <div class="queue-section">
        <div class="section-label">// playlist</div>
        <ul id="trackList"><li class="empty" onclick="pickFolder()"><span class="tname">no tracks added</span></li></ul>
      </div>
    </div>
  </div>

  <div class="bottombar">
    <span>next — <span id="nextUp">nothing queued</span></span>
    <span class="right-hints"><span id="loopIndicator" class="loop-ind"></span><span id="dropHint" class="drop-hint">drop tracks or folders to add</span><span id="queueCount"></span></span>
  </div>
</div>
<input type="file" id="fileInput" accept="audio/*" multiple onchange="loadFiles(this.files)"/>

<!-- confirm dialog -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-msg" id="confirmMsg"></div>
    <div class="confirm-btns">
      <button onclick="confirmCancel()">[ cancel ]</button>
      <button class="btn-confirm" id="confirmOk" onclick="confirmOk()">[ remove ]</button>
    </div>
  </div>
</div>

<!-- track right-click menu -->
<div class="ctx-menu" id="trackCtxMenu"></div>

<!-- command panel (ctrl+y) -->
<div class="cmdp-overlay" id="cmdOverlay">
  <div class="cmdp-box">
    <div class="cmdp-inputrow">
      <span class="cmdp-prompt">hazel<span class="hi">@foli</span>:~$</span>
      <input type="text" id="cmdInput" class="cmdp-input" placeholder="jump to track..." autocomplete="off" spellcheck="false"/>
    </div>
    <div class="section-label cmdp-label">// jump to track</div>
    <ul id="cmdResults" class="cmdp-results"></ul>
    <div class="cmdp-hint">↑↓ navigate &nbsp;·&nbsp; ⏎ play &nbsp;·&nbsp; esc close</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<script>
// ── confirm dialog ──
let pendingConfirm = null;
function showConfirm(msg, onOk) {
  document.getElementById('confirmMsg').innerHTML = msg;
  document.getElementById('confirmOverlay').classList.add('show');
  pendingConfirm = onOk;
}
function confirmOk() {
  document.getElementById('confirmOverlay').classList.remove('show');
  if (pendingConfirm) { pendingConfirm(); pendingConfirm = null; }
}
function confirmCancel() {
  document.getElementById('confirmOverlay').classList.remove('show');
  pendingConfirm = null;
}
document.getElementById('confirmOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) confirmCancel();
});

// ── state ──
const MAX_QUEUES = 4;
let queues = [{ name: 'main', tracks: [], currentIdx: -1 }];
let activeQ = 0;
let manualQueue = [];       // spotify-style "play next" queue — independent of playlists
let queueUid = 1;
let nowPlayingUid = null;   // uid of whatever track is currently loaded/playing
let lastPlayedEntry = null; // entry object of whatever was last handed to playEntry()
let loopMode = 'none';      // 'none' | 'playlist' | 'track'

// ── audio ──
let audioCtx, analyser, gainNode;
const audioEl = new Audio();
let playing = false;
let animFrame;
const BARS = 90;
let peakH = new Array(BARS).fill(0);
let peakV = new Array(BARS).fill(0);
let currentBars = new Array(BARS).fill(0);
let accentH = 35, accentS = 15, accentL = 55;

// ── canvas ──
const canvas = document.getElementById('visCanvas');
const ctx = canvas.getContext('2d');
function resize() {
  canvas.width = canvas.offsetWidth * devicePixelRatio;
  canvas.height = canvas.offsetHeight * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
}
resize();
window.addEventListener('resize', () => { resize(); if (!playing) drawIdle(); });

function fmt(s) { s = Math.floor(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

function extractAccent(img) {
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const cx = c.getContext('2d'); cx.drawImage(img, 0, 0, 64, 64);
  const d = cx.getImageData(0, 0, 64, 64).data;
  let rS = 0, gS = 0, bS = 0, count = 0;
  for (let i = 0; i < d.length; i += 8) {
    const r = d[i], g = d[i+1], b = d[i+2];
    const sat = Math.max(r,g,b) - Math.min(r,g,b), bright = (r+g+b)/3;
    if (sat > 20 && bright > 30 && bright < 230) { rS += r; gS += g; bS += b; count++; }
  }
  if (count < 20) { accentH = 35; accentS = 15; accentL = 55; applyAccent(); return; }
  const rn = rS/count/255, gn = gS/count/255, bn = bS/count/255;
  const max = Math.max(rn,gn,bn), min = Math.min(rn,gn,bn), l = (max+min)/2;
  let h = 0, s = 0;
  if (max !== min) {
    const d = max - min; s = l > 0.5 ? d/(2-max-min) : d/(max+min);
    switch(max) { case rn: h=((gn-bn)/d+(gn<bn?6:0))/6; break; case gn: h=((bn-rn)/d+2)/6; break; case bn: h=((rn-gn)/d+4)/6; break; }
  }
  accentH = Math.round(h*360);
  accentS = Math.round(Math.max(25, Math.min(70, s*100)));
  accentL = Math.round(Math.max(40, Math.min(70, l*100)));
  applyAccent();
}
function applyAccent() {
  document.getElementById('progFill').style.background = `hsl(${accentH},${accentS}%,${accentL}%)`;
}
function barColor(i, v) {
  const t = i/BARS, h = accentH + (t-0.5)*30;
  const raw = accentL*0.3 + v*accentL*1.1;
  const l = Math.max(8, Math.min(85, Math.round(raw/8)*8));
  return { fill: `hsla(${h},${accentS+v*20}%,${l}%,${0.2+v*0.8})`, tip: `hsla(${h},${accentS+v*20}%,${Math.min(92,l+18)}%,0.9)` };
}

function drawFrame() {
  const w = canvas.offsetWidth, h = canvas.offsetHeight;
  ctx.fillStyle = '#0d0c0b'; ctx.fillRect(0,0,w,h);
  const bw = w/BARS;
  for (let i = 0; i < BARS; i++) {
    const v = currentBars[i], barH = Math.max(1, v*(h-4));
    if (peakH[i] < barH) { peakH[i] = barH; peakV[i] = 0; }
    else { peakV[i] += 0.28; peakH[i] = Math.max(0, peakH[i]-peakV[i]); }
    const {fill, tip} = barColor(i, v);
    ctx.fillStyle = fill; ctx.fillRect(i*bw+1, h-barH, bw-2, barH);
    ctx.fillStyle = tip; ctx.fillRect(i*bw+1, h-barH, bw-2, 1.5);
    if (peakH[i] > 2) { const {tip:pt} = barColor(i, peakH[i]/h); ctx.fillStyle = pt; ctx.fillRect(i*bw+1, h-peakH[i]-1.5, bw-2, 1.5); }
  }
}
function drawIdle() {
  const w = canvas.offsetWidth, h = canvas.offsetHeight;
  ctx.fillStyle = '#0d0c0b'; ctx.fillRect(0,0,w,h);
  const bw = w/BARS;
  for (let i = 0; i < BARS; i++) { ctx.fillStyle = '#1e1c19'; ctx.fillRect(i*bw+1, h/2-0.5, bw-2, 1); }
}
function startDecay() {
  function frame() {
    let any = false;
    for (let i = 0; i < BARS; i++) { currentBars[i] = Math.max(0, currentBars[i]-0.022); if (currentBars[i] > 0.004) any = true; }
    drawFrame();
    if (any) animFrame = requestAnimationFrame(frame);
    else { peakH.fill(0); peakV.fill(0); drawIdle(); }
  }
  frame();
}
function startRise() {
  const bufLen = analyser.frequencyBinCount, data = new Uint8Array(bufLen);
  function frame() {
    animFrame = requestAnimationFrame(frame);
    analyser.getByteFrequencyData(data);
    for (let i = 0; i < BARS; i++) { const idx = Math.floor(i/BARS*bufLen*0.75); currentBars[i] += (data[idx]/255 - currentBars[i])*0.18; }
    drawFrame();
  }
  frame();
}
drawIdle();

audioEl.addEventListener('timeupdate', () => {
  const p = audioEl.duration ? audioEl.currentTime/audioEl.duration*100 : 0;
  document.getElementById('progFill').style.width = p+'%';
  document.getElementById('timeEl').textContent = fmt(audioEl.currentTime);
  document.getElementById('durEl').textContent = fmt(audioEl.duration);
});
audioEl.addEventListener('ended', () => {
  playing = false; document.getElementById('playBtn').textContent = '[ play ]';
  cancelAnimationFrame(animFrame); startDecay();
  if (loopMode === 'track' && lastPlayedEntry) {
    setTimeout(() => playEntry(lastPlayedEntry), 300);
    return;
  }
  if (manualQueue.length) {
    setTimeout(() => playFromManualQueue(), 600);
    return;
  }
  const q = queues[activeQ];
  if (q.currentIdx < q.tracks.length-1) setTimeout(() => playIndex(q.currentIdx+1), 600);
  else if (loopMode === 'playlist' && q.tracks.length) setTimeout(() => playIndex(0), 600);
});
document.getElementById('progTrack').addEventListener('click', e => {
  if (!audioEl.src) return;
  const r = e.currentTarget.getBoundingClientRect();
  audioEl.currentTime = ((e.clientX-r.left)/r.width)*audioEl.duration;
});

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser(); analyser.fftSize = 512; analyser.smoothingTimeConstant = 0.8;
  gainNode = audioCtx.createGain();
  const src = audioCtx.createMediaElementSource(audioEl);
  src.connect(gainNode); gainNode.connect(analyser); analyser.connect(audioCtx.destination);
  gainNode.gain.value = 0.8;
}
function setVol(v) { if (gainNode) gainNode.gain.value = parseFloat(v); else audioEl.volume = parseFloat(v); }

function togglePlay() {
  if (!audioEl.src) { pickFolder(); return; }
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (playing) {
    audioEl.pause(); playing = false;
    document.getElementById('playBtn').textContent = '[ play ]';
    cancelAnimationFrame(animFrame); startDecay();
  } else {
    audioEl.play(); playing = true;
    document.getElementById('playBtn').textContent = '[ pause ]';
    cancelAnimationFrame(animFrame); startRise();
  }
}
function seek(s) { if (!audioEl.src) return; audioEl.currentTime = Math.max(0, Math.min(audioEl.duration, audioEl.currentTime+s)); }

// ── track right-click menu ──
let ctxTrack = null;
function showTrackMenu(e, track) {
  ctxTrack = track;
  const menu = document.getElementById('trackCtxMenu');
  const isQueued = manualQueue.some(x => x._uid === track._uid);
  menu.innerHTML = `
    <div class="ctx-item" onclick="ctxPlayNow()">▸ play now</div>
    <div class="ctx-item" onclick="ctxToggleQueue()">${isQueued ? '− remove from queue' : '+ add to queue'}</div>
  `;
  menu.classList.add('show');
  const x = Math.min(e.clientX, window.innerWidth - menu.offsetWidth - 10);
  const y = Math.min(e.clientY, window.innerHeight - menu.offsetHeight - 10);
  menu.style.left = x + 'px'; menu.style.top = y + 'px';
}
function hideTrackMenu() { document.getElementById('trackCtxMenu').classList.remove('show'); ctxTrack = null; }
function ctxPlayNow() {
  if (!ctxTrack) return;
  const q = queues[activeQ], idx = q.tracks.findIndex(x => x._uid === ctxTrack._uid);
  if (idx >= 0) playIndex(idx); else playEntry(ctxTrack);
  hideTrackMenu();
}
function ctxToggleQueue() {
  if (!ctxTrack) return;
  const idx = manualQueue.findIndex(x => x._uid === ctxTrack._uid);
  if (idx >= 0) manualQueue.splice(idx, 1); else manualQueue.push(ctxTrack);
  renderTrackList(); updateBottomBar();
  hideTrackMenu();
}
document.addEventListener('click', e => { if (!e.target.closest('#trackCtxMenu')) hideTrackMenu(); });
document.addEventListener('contextmenu', e => { if (!e.target.closest('#trackList li:not(.empty)')) hideTrackMenu(); });
window.addEventListener('blur', hideTrackMenu);
window.addEventListener('resize', hideTrackMenu);

// ── queue tabs ──
function renderTabs() {
  const container = document.getElementById('queueTabs');
  container.innerHTML = '';
  queues.forEach((q, i) => {
    const tab = document.createElement('div');
    tab.className = 'qtab' + (i === activeQ ? ' active' : '');
    const name = document.createElement('span');
    name.className = 'qname';
    name.textContent = q.name;
    name.contentEditable = i === activeQ ? 'true' : 'false';
    name.spellcheck = false;
    name.addEventListener('click', e => { if (i === activeQ) e.stopPropagation(); else switchQueue(i); });
    name.addEventListener('blur', () => { q.name = name.textContent.trim() || 'playlist'; name.textContent = q.name; saveState(); });
    name.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); name.blur(); } });
    tab.appendChild(name);
    if (queues.length > 1) {
      const del = document.createElement('span');
      del.className = 'qdel'; del.textContent = '×'; del.title = 'remove playlist';
      del.onclick = e => {
        e.stopPropagation();
        showConfirm(
          `remove playlist <span class="warn">"${q.name}"</span>?<br/>all tracks in this playlist will be cleared.`,
          () => removeQueue(i)
        );
      };
      tab.appendChild(del);
    }
    tab.onclick = () => switchQueue(i);
    container.appendChild(tab);
  });
  document.getElementById('qaddBtn').className = 'qadd' + (queues.length >= MAX_QUEUES ? ' hidden' : '');
}

function switchQueue(i) {
  if (i === activeQ) return;
  activeQ = i; renderTabs(); renderTrackList(); updateBottomBar();
}
function addQueue() {
  if (queues.length >= MAX_QUEUES) return;
  queues.push({ name: 'playlist '+(queues.length+1), tracks: [], currentIdx: -1 });
  activeQ = queues.length - 1;
  renderTabs(); renderTrackList(); updateBottomBar();
  setTimeout(() => {
    const tabs = document.querySelectorAll('.qtab');
    const nameEl = tabs[activeQ]?.querySelector('.qname');
    if (nameEl) { nameEl.focus(); const r = document.createRange(); r.selectNodeContents(nameEl); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
  }, 50);
}
function removeQueue(i) {
  if (queues.length <= 1) return;
  queues.splice(i, 1);
  if (activeQ >= queues.length) activeQ = queues.length - 1;
  renderTabs(); renderTrackList(); updateBottomBar(); saveState();
}

function renderTrackList() {
  const q = queues[activeQ];
  const ul = document.getElementById('trackList');
  ul.innerHTML = '';
  if (!q.tracks.length) {
    const li = document.createElement('li'); li.className = 'empty';
    li.innerHTML = '<span class="tname">no tracks added</span>';
    li.onclick = () => pickFolder();
    ul.appendChild(li); return;
  }
  q.tracks.forEach((t, i) => {
    const li = document.createElement('li');
    const isNow = t._uid === nowPlayingUid;
    const isQueued = manualQueue.some(e => e._uid === t._uid);
    li.className = [isNow ? 'now' : '', isQueued ? 'queued' : ''].join(' ').trim();
    li.innerHTML = `<span class="idx">${String(i+1).padStart(2,'0')}</span><span class="tname dr">${t.title||t.name}</span>${isQueued ? '<span class="qbadge">queued</span>' : ''}<span class="tart">${t.artist||''}</span>`;
    li.onclick = () => playIndex(i);
    li.oncontextmenu = e => { e.preventDefault(); showTrackMenu(e, t); };
    ul.appendChild(li);
  });
}
function updateBottomBar() {
  const q = queues[activeQ];
  let nextText;
  if (manualQueue.length) {
    const n = manualQueue[0];
    nextText = '▸ ' + (n.title||n.name) + (n.artist ? ' · '+n.artist : '');
  } else {
    const next = q.tracks[q.currentIdx+1];
    nextText = next ? (next.title||next.name)+(next.artist?' · '+next.artist:'') : 'end of playlist';
  }
  document.getElementById('nextUp').textContent = nextText;
  document.getElementById('queueCount').textContent = q.tracks.length ? q.tracks.length+' tracks' : '';
}

// ── playback ──
function playEntry(entry) {
  nowPlayingUid = entry._uid;
  lastPlayedEntry = entry;
  audioEl.src = entry.url; audioEl.load();
  document.getElementById('trackTitle').textContent = entry.title || entry.name;
  document.getElementById('trackSub').textContent = [entry.artist, entry.album].filter(Boolean).join(' · ') || '—';
  const artEl = document.getElementById('albumArt'), ph = document.getElementById('artPh');
  ph.classList.add('has-track');
  if (entry.artUrl) { artEl.onload = () => extractAccent(artEl); artEl.src = entry.artUrl; artEl.style.display = 'block'; ph.style.display = 'none'; }
  else { artEl.style.display = 'none'; ph.style.display = 'flex'; accentH = 35; accentS = 15; accentL = 55; applyAccent(); }
  renderTrackList(); updateBottomBar();
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  currentBars.fill(0); peakH.fill(0); peakV.fill(0);
  audioEl.play().then(() => {
  playing = true;
  document.getElementById('playBtn').textContent = '[ pause ]';
  cancelAnimationFrame(animFrame);
  startRise();
  fetch('http://localhost:6969/now-playing', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      track: entry.title || entry.name,
      artist: entry.artist || '',
      album: entry.album || '',
      elapsed: 0,
      duration: audioEl.duration || 0
    })
  }).catch(() => {});
}).catch(console.error)
}
function playIndex(idx) {
  const q = queues[activeQ];
  if (idx < 0 || idx >= q.tracks.length) return;
  q.currentIdx = idx;
  playEntry(q.tracks[idx]);
}
function playFromManualQueue() {
  const entry = manualQueue.shift();
  playEntry(entry);
}

// ── file loading ──
function isAudioFile(f) { return f.type.startsWith('audio/') || /\.(mp3|flac|wav|ogg|m4a|aac|opus)$/i.test(f.name); }
function processFile(file, callback) {
  const url = URL.createObjectURL(file);
  const entry = { name: file.name.replace(/\.[^.]+$/, ''), url, title: null, artist: null, album: null, artUrl: null, _uid: queueUid++ };
  jsmediatags.read(file, {
    onSuccess(tag) {
      const t = tag.tags;
      entry.title = t.title||null; entry.artist = t.artist||null; entry.album = t.album||null;
      if (t.picture) { const blob = new Blob([new Uint8Array(t.picture.data)], {type:t.picture.format}); entry.artUrl = URL.createObjectURL(blob); }
      callback(entry);
    },
    onError() { callback(entry); }
  });
}
function loadFiles(files) {
  const arr = Array.from(files).filter(isAudioFile);
  if (!arr.length) return;
  const q = queues[activeQ], startIdx = q.tracks.length;
  let done = 0;
  arr.forEach(file => {
    processFile(file, entry => {
      q.tracks.push(entry); done++;
      if (done === arr.length) { renderTrackList(); updateBottomBar(); if (q.currentIdx < 0) playIndex(startIdx); saveState(); }
    });
  });
}

// ── folder access ──
async function pickFolder() {
  if (!('showDirectoryPicker' in window)) { document.getElementById('fileInput').click(); return; }
  try {
    const handle = await window.showDirectoryPicker({ mode: 'read' });
    await loadFromHandle(handle, true);
  } catch(e) { if (e.name !== 'AbortError') console.error(e); }
}
function artPhClick() {
  // once a track is loaded, this is just the "no album art" icon — clicking it shouldn't relaunch the picker
  if (document.getElementById('artPh').classList.contains('has-track')) return;
  pickFolder();
}
async function collectFilesFromDirHandle(dirHandle, files) {
  for await (const entry of dirHandle.values()) {
    if (entry.kind === 'file') {
      const f = await entry.getFile();
      if (isAudioFile(f)) files.push(f);
    } else if (entry.kind === 'directory') {
      await collectFilesFromDirHandle(entry, files);
    }
  }
}
async function loadFromHandle(handle, store) {
  const q = queues[activeQ], files = [];
  await collectFilesFromDirHandle(handle, files);
  if (!files.length) { document.getElementById('folderStatus').textContent = 'no audio files found'; return; }
  document.getElementById('folderStatus').textContent = `loading ${files.length} tracks...`;
  if (store) {
    try {
      const db = await openDB();
      const tx = db.transaction('folders', 'readwrite');
      tx.objectStore('folders').put({ id: 'q'+activeQ, handle });
      await tx.done;
    } catch(e) {}
  }
  const startIdx = q.tracks.length;
  let done = 0;
  files.forEach(file => {
    processFile(file, entry => {
      q.tracks.push(entry); done++;
      if (done === files.length) {
        document.getElementById('folderStatus').textContent = `${files.length} tracks loaded`;
        renderTrackList(); updateBottomBar();
        if (q.currentIdx < 0) playIndex(startIdx);
        saveState();
      }
    });
  });
}

// ── drag & drop (files, folders, nested folders) ──
function traverseEntry(entry, files) {
  return new Promise(resolve => {
    if (entry.isFile) {
      entry.file(f => { if (isAudioFile(f)) files.push(f); resolve(); }, () => resolve());
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      const readBatch = () => {
        reader.readEntries(async entries => {
          if (!entries.length) { resolve(); return; }
          await Promise.all(entries.map(e => traverseEntry(e, files)));
          readBatch(); // readEntries only returns entries in batches — keep reading until empty
        }, () => resolve());
      };
      readBatch();
    } else resolve();
  });
}
const appEl = document.getElementById('app');
let dragDepth = 0;
appEl.addEventListener('dragenter', e => {
  e.preventDefault();
  dragDepth++;
  appEl.classList.add('drag-active');
});
appEl.addEventListener('dragover', e => e.preventDefault());
appEl.addEventListener('dragleave', () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) appEl.classList.remove('drag-active');
});
appEl.addEventListener('drop', async e => {
  e.preventDefault();
  dragDepth = 0;
  appEl.classList.remove('drag-active');
  const items = e.dataTransfer && e.dataTransfer.items;
  if (!items || !items.length) return;
  const files = [];
  const entries = [];
  for (const item of items) {
    if (item.kind !== 'file') continue;
    const entry = item.webkitGetAsEntry && item.webkitGetAsEntry();
    if (entry) entries.push(entry);
    else { const f = item.getAsFile(); if (f) files.push(f); }
  }
  if (entries.length) {
    document.getElementById('folderStatus').textContent = 'reading dropped files...';
    await Promise.all(entries.map(en => traverseEntry(en, files)));
  }
  if (files.length) loadFiles(files);
  else document.getElementById('folderStatus').textContent = 'no audio files found';
});

// ── IndexedDB ──
function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('foli', 1);
    req.onupgradeneeded = e => { e.target.result.createObjectStore('folders', {keyPath:'id'}); };
    req.onsuccess = e => {
      const db = e.target.result;
      const origTx = db.transaction.bind(db);
      db.transaction = function(stores, mode) {
        const tx = origTx(stores, mode);
        tx.done = new Promise((r, rj) => { tx.oncomplete = () => r(); tx.onerror = () => rj(tx.error); });
        return tx;
      };
      res(db);
    };
    req.onerror = () => rej(req.error);
  });
}
async function restoreFolders() {
  if (!('showDirectoryPicker' in window)) return;
  try {
    const db = await openDB();
    const tx = db.transaction('folders', 'readonly');
    const all = await new Promise((r, rj) => { const req = tx.objectStore('folders').getAll(); req.onsuccess = () => r(req.result); req.onerror = () => rj(req.error); });
    for (const {id, handle} of all) {
      const qIdx = parseInt(id.replace('q', ''));
      if (isNaN(qIdx)) continue;
      while (queues.length <= qIdx) queues.push({ name: 'playlist '+(queues.length+1), tracks: [], currentIdx: -1 });
      try {
        const perm = await handle.queryPermission({mode:'read'});
        if (perm === 'granted') { activeQ = qIdx; await loadFromHandle(handle, false); }
        else { const r = await handle.requestPermission({mode:'read'}); if (r === 'granted') { activeQ = qIdx; await loadFromHandle(handle, false); } }
      } catch(e) {}
    }
    activeQ = 0; renderTabs(); renderTrackList(); updateBottomBar();
  } catch(e) {}
}

// ── persist ──
function saveState() {
  try { localStorage.setItem('foli-queues', JSON.stringify(queues.map(q => ({name:q.name})))); } catch(e) {}
}
function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem('foli-queues') || 'null');
    if (saved && Array.isArray(saved)) {
      queues = saved.slice(0,MAX_QUEUES).map(q => ({name:q.name||'playlist',tracks:[],currentIdx:-1}));
      if (!queues.length) queues = [{name:'main',tracks:[],currentIdx:-1}];
    }
  } catch(e) {}
}

// ── loop mode (alt+y) ──
function setLoopMode(mode) {
  loopMode = mode;
  const el = document.getElementById('loopIndicator');
  if (mode === 'playlist') { el.textContent = '⟲ loop: playlist'; el.classList.add('show'); }
  else if (mode === 'track') { el.textContent = '⟲ loop: track'; el.classList.add('show'); }
  else { el.textContent = ''; el.classList.remove('show'); }
}
let altYPending = false, altYTimer = null;
function handleAltY() {
  if (altYPending) {
    // second press landed within the window — this is a double-press
    clearTimeout(altYTimer);
    altYPending = false;
    setLoopMode(loopMode === 'track' ? 'none' : 'track');
  } else {
    altYPending = true;
    altYTimer = setTimeout(() => {
      altYPending = false;
      // no second press came — this was a single press
      setLoopMode(loopMode === 'playlist' ? 'none' : 'playlist');
    }, 350);
  }
}

document.addEventListener('keydown', e => {
  const cmdOpen = document.getElementById('cmdOverlay').classList.contains('show');
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyY') {
    e.preventDefault();
    cmdOpen ? closeCmdPanel() : openCmdPanel();
    return;
  }
  if (e.altKey && e.code === 'KeyY') {
    e.preventDefault();
    if (!cmdOpen) handleAltY();
    return;
  }
  if (cmdOpen) return; // let the command panel's own listener handle nav/escape/typing
  if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowLeft') seek(-10);
  if (e.code === 'ArrowRight') seek(10);
});

// ── command panel (ctrl+y) ──
let cmdResults = [];
let cmdSelIndex = -1;

function openCmdPanel() {
  const overlay = document.getElementById('cmdOverlay');
  const input = document.getElementById('cmdInput');
  overlay.classList.add('show');
  input.value = '';
  renderCmdResults('');
  setTimeout(() => input.focus(), 10);
}
function closeCmdPanel() {
  document.getElementById('cmdOverlay').classList.remove('show');
  document.getElementById('cmdInput').blur();
}
document.getElementById('cmdOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeCmdPanel();
});

function fuzzyScore(query, text) {
  query = query.toLowerCase(); text = text.toLowerCase();
  let qi = 0, score = 0, lastIndex = -1;
  for (let ti = 0; ti < text.length && qi < query.length; ti++) {
    if (text[ti] === query[qi]) {
      score += (lastIndex === ti - 1) ? 3 : 1;
      lastIndex = ti; qi++;
    }
  }
  if (qi < query.length) return -1;
  if (text.startsWith(query)) score += 10;
  return score;
}

function getAllTracksFlat() {
  const out = [];
  queues.forEach((q, qi) => {
    q.tracks.forEach((t, ti) => {
      out.push({ track: t, qi, ti, qname: q.name, name: t.title || t.name, artist: t.artist || '' });
    });
  });
  return out;
}

function renderCmdResults(query) {
  query = query.trim();
  let list = getAllTracksFlat();
  if (query) {
    list = list
      .map(item => ({ ...item, score: fuzzyScore(query, item.name + ' ' + item.artist) }))
      .filter(item => item.score >= 0)
      .sort((a, b) => b.score - a.score);
  }
  list = list.slice(0, 50);
  cmdResults = list;
  cmdSelIndex = list.length ? 0 : -1;

  const ul = document.getElementById('cmdResults');
  ul.innerHTML = '';
  if (!list.length) {
    const li = document.createElement('li');
    li.className = 'cmdp-empty';
    li.textContent = query ? 'no matches' : 'no tracks loaded';
    ul.appendChild(li);
    return;
  }
  list.forEach((item, i) => {
    const li = document.createElement('li');
    li.className = 'cmdp-item' + (i === cmdSelIndex ? ' sel' : '');
    li.innerHTML = `<span class="tname dr">${item.name}</span><span class="tart">${item.artist}</span><span class="qbadge">${item.qname}</span>`;
    li.onclick = () => jumpToCmdResult(i);
    li.onmouseenter = () => { cmdSelIndex = i; updateCmdSel(); };
    ul.appendChild(li);
  });
}

function updateCmdSel() {
  const items = document.querySelectorAll('#cmdResults .cmdp-item');
  items.forEach((li, i) => li.classList.toggle('sel', i === cmdSelIndex));
  const sel = items[cmdSelIndex];
  if (sel) sel.scrollIntoView({ block: 'nearest' });
}

function jumpToCmdResult(i) {
  const item = cmdResults[i];
  if (!item) return;
  if (item.qi !== activeQ) { activeQ = item.qi; renderTabs(); }
  playIndex(item.ti);
  closeCmdPanel();
}

const cmdInputEl = document.getElementById('cmdInput');
cmdInputEl.addEventListener('input', () => renderCmdResults(cmdInputEl.value));
cmdInputEl.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); closeCmdPanel(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); if (cmdResults.length) { cmdSelIndex = (cmdSelIndex + 1) % cmdResults.length; updateCmdSel(); } }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (cmdResults.length) { cmdSelIndex = (cmdSelIndex - 1 + cmdResults.length) % cmdResults.length; updateCmdSel(); } }
  else if (e.key === 'Enter') { e.preventDefault(); if (cmdSelIndex >= 0) jumpToCmdResult(cmdSelIndex); }
});

loadState(); renderTabs(); renderTrackList(); updateBottomBar(); restoreFolders();
</script>
